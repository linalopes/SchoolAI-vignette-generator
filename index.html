<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@300;600&family=Space+Grotesk:wght@300;500&display=swap" rel="stylesheet">
    <title>School of Tomorrow's AI Vignette Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.0/lib/p5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5.js-svg@1.6.0/dist/p5.svg.min.js"></script>
    <style>
        * {
          box-sizing: border-box;
        }

        :root {
          --color-bg:        #FFFFFF;
          --color-text:      #22113E;
          --color-text-muted:#888888;
          --color-surface:   #CAD8D8;
          --color-primary:   #EA7DFF;
          --color-on-primary:#22113E;
          --color-accent:    #08F2DB;
          --color-border:    rgba(34, 17, 62, 0.12);
          --font-title:      'Space Grotesk', sans-serif;
          --font-body:       'Inter', sans-serif;
          --font-mono:       'Courier Prime', monospace;
          --radius:          4px;
          --space-2:         10px;
          --space-3:         16px;
          --space-4:         24px;
        }

        body {
          margin: 0;
          padding: 0;
          overflow: hidden;
          font-family: var(--font-body);
          font-weight: 300;
          background: var(--color-surface);
          display: flex;
          height: 100vh;
          color: var(--color-text);
        }

        #stage {
          flex: 1;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 20px;
          background: var(--color-surface);
        }

        #stage canvas {
          box-shadow: 0 2px 12px rgba(34, 17, 62, 0.12);
        }

        #panel {
          width: 280px;
          background: var(--color-bg);
          border-left: 0.5px solid var(--color-border);
          color: var(--color-text);
          padding: var(--space-4);
          overflow-y: auto;
          display: flex;
          flex-direction: column;
          gap: var(--space-3);
        }

        #panel h3 {
          margin: 0 0 var(--space-2) 0;
          font-family: var(--font-mono);
          font-size: 10px;
          font-weight: 400;
          letter-spacing: 0.14em;
          color: var(--color-text-muted);
          text-transform: uppercase;
        }

        #panel label {
          display: block;
          font-family: var(--font-mono);
          font-size: 10px;
          font-weight: 400;
          letter-spacing: 0.10em;
          color: var(--color-text-muted);
          margin-bottom: 4px;
        }

        #panel input[type="range"] {
          width: 100%;
          margin-bottom: 4px;
          accent-color: var(--color-primary);
        }

        #panel input[type="text"],
        #panel input[type="number"],
        #panel select {
          width: 100%;
          padding: 8px var(--space-3);
          border: 0.5px solid rgba(34, 17, 62, 0.25);
          border-radius: var(--radius);
          background: var(--color-bg);
          color: var(--color-text);
          font-family: var(--font-body);
          font-size: 13px;
          font-weight: 300;
          outline: none;
          transition: border-color 0.2s ease;
        }

        #panel input[type="text"]:focus,
        #panel input[type="number"]:focus,
        #panel select:focus {
          border-color: var(--color-primary);
        }

        #panel select {
          cursor: pointer;
        }

        #panel button {
          padding: 8px var(--space-3);
          border: 0.5px solid var(--color-border);
          border-radius: var(--radius);
          cursor: pointer;
          font-family: var(--font-mono);
          font-size: 10px;
          font-weight: 400;
          letter-spacing: 0.10em;
          background: transparent;
          color: var(--color-text);
          transition: background 0.2s ease, border-color 0.2s ease;
        }

        #panel button:hover {
          background: rgba(34, 17, 62, 0.04);
        }

        #panel button.primary {
          background: var(--color-primary);
          color: var(--color-on-primary);
          border-color: var(--color-primary);
        }

        #panel button.primary:hover {
          opacity: 0.9;
        }

        #panel button.secondary {
          background: transparent;
          color: var(--color-text-muted);
          border-color: var(--color-border);
        }

        #panel button.secondary:hover {
          color: var(--color-text);
          border-color: rgba(34, 17, 62, 0.4);
        }

        #panel button.export {
          background: var(--color-accent);
          color: var(--color-on-primary);
          border-color: var(--color-accent);
          width: 100%;
          margin-top: var(--space-2);
        }

        #panel button.export:hover {
          opacity: 0.9;
        }

        #panel button:disabled {
          opacity: 0.3;
          cursor: not-allowed;
        }

        .control-group {
          border-bottom: 0.5px solid var(--color-border);
          padding-bottom: var(--space-3);
        }

        .control-group:last-child {
          border-bottom: none;
        }

        .value-display {
          font-family: var(--font-mono);
          font-size: 10px;
          color: var(--color-primary);
          float: right;
        }

        .button-row {
          display: flex;
          gap: 6px;
        }

        .button-row button {
          flex: 1;
        }

        .checkbox-row {
          display: flex;
          align-items: center;
          gap: 8px;
          margin-bottom: 6px;
        }

        .checkbox-row input[type="checkbox"] {
          width: 14px;
          height: 14px;
          accent-color: var(--color-primary);
        }

        .checkbox-row label {
          margin: 0;
          font-size: 12px;
          color: var(--color-text);
          letter-spacing: 0;
        }

        .custom-size-row {
          display: flex;
          gap: 6px;
          margin-top: 6px;
        }

        .custom-size-row input {
          flex: 1;
        }

        .hidden {
          display: none !important;
        }

        .export-status {
          font-family: var(--font-mono);
          font-size: 10px;
          margin-top: 6px;
          padding: 6px 8px;
          border-radius: var(--radius);
        }

        .export-status.error {
          background: rgba(204, 68, 68, 0.08);
          color: #CC4444;
        }

        .export-status.success {
          background: rgba(8, 242, 219, 0.12);
          color: var(--color-text);
        }

        .export-status.warning {
          background: rgba(34, 17, 62, 0.06);
          color: var(--color-text-muted);
        }

        .record-status {
          font-family: var(--font-mono);
          font-size: 10px;
          margin-top: 6px;
          padding: 6px 8px;
          border-radius: var(--radius);
          text-align: center;
          letter-spacing: 0.08em;
        }

        .record-status.idle {
          background: rgba(34, 17, 62, 0.04);
          color: var(--color-text-muted);
        }

        .record-status.recording {
          background: rgba(234, 125, 255, 0.10);
          color: var(--color-primary);
          animation: pulse 1s infinite;
        }

        .record-status.success {
          background: rgba(8, 242, 219, 0.12);
          color: var(--color-text);
        }

        .record-status.error {
          background: rgba(204, 68, 68, 0.08);
          color: #CC4444;
        }

        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.6; }
        }

        #panel button.record {
          background: var(--color-primary);
          color: var(--color-on-primary);
          border-color: var(--color-primary);
        }

        #panel button.record:hover {
          opacity: 0.9;
        }

        #panel button.record.recording {
          background: var(--color-primary);
          animation: pulse 1s infinite;
        }

        .controls-locked {
          opacity: 0.4;
          pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="stage"></div>
    <div id="panel">
        <div class="control-group">
            <h3>Format</h3>
            <label>Aspect Ratio</label>
            <select id="formatSelect">
                <option value="LANDSCAPE_16_9">Landscape 16:9 (1920x1080)</option>
                <option value="PORTRAIT_9_16">Portrait 9:16 (1080x1920)</option>
            </select>
        </div>

        <div class="control-group">
            <h3>Animation</h3>
            <label>Speed <span class="value-display" id="speedValue">1.0</span></label>
            <input type="range" id="speedSlider" min="0" max="10" step="0.1" value="1">

            <label>Max Visible Points <span class="value-display" id="maxShowValue">1000</span></label>
            <input type="range" id="maxShowSlider" min="50" max="3000" step="50" value="1000">
        </div>

        <div class="control-group">
            <h3>Drawing</h3>
            <label>Number of Lines <span class="value-display" id="numLinesValue">17</span></label>
            <input type="range" id="numLinesSlider" min="1" max="30" step="1" value="17">
        </div>

        <div class="control-group">
            <h3>Vignette Text</h3>
            <label>Line 1</label>
            <input type="text" id="line1Input" value="School of">
            <label style="margin-top: 8px;">Line 2</label>
            <input type="text" id="line2Input" value="Tomorrow's AI">
        </div>

        <div class="control-group">
            <h3>Actions</h3>
            <div class="button-row">
                <button class="primary" id="resetBtn">Reset Default</button>
                <button class="secondary" id="clearBtn">Clear</button>
            </div>
        </div>

        <div class="control-group">
            <h3>Export SVG</h3>
            <label>Export Size</label>
            <select id="exportSizeSelect">
                <option value="match">Match Canvas</option>
                <option value="landscape">Preset: Landscape 1920x1080</option>
                <option value="portrait">Preset: Portrait 1080x1920</option>
                <option value="custom">Custom</option>
            </select>
            <div id="customSizeInputs" class="custom-size-row hidden">
                <input type="number" id="customWidth" placeholder="Width" value="1920" min="100" max="4096">
                <input type="number" id="customHeight" placeholder="Height" value="1080" min="100" max="4096">
            </div>
            <div style="margin-top: 12px;">
                <div class="checkbox-row">
                    <input type="checkbox" id="includeBackground" checked>
                    <label for="includeBackground">Include background</label>
                </div>
                <div class="checkbox-row">
                    <input type="checkbox" id="includeSplashes" checked>
                    <label for="includeSplashes">Include splashes</label>
                </div>
            </div>
            <button class="export" id="exportBtn" style="width: 100%; margin-top: 8px;">Download SVG (S)</button>
            <div id="exportStatus" class="hidden export-status"></div>
        </div>

        <div class="control-group" id="recordSection">
            <h3>Record Video</h3>
            <label>Recording Resolution</label>
            <select id="recordResolutionSelect">
                <option value="match" selected>Match Format</option>
                <option value="1280x720">1280x720 (HD)</option>
                <option value="1920x1080">1920x1080 (Full HD)</option>
                <option value="1080x1920">1080x1920 (Full HD Portrait)</option>
                <option value="2560x1440">2560x1440 (QHD)</option>
                <option value="3840x2160">3840x2160 (4K)</option>
            </select>

            <label style="margin-top: 8px;">Recording FPS</label>
            <select id="recordFpsSelect">
                <option value="30">30 FPS</option>
                <option value="60">60 FPS</option>
            </select>

            <label style="margin-top: 8px;">Quality / Bitrate</label>
            <select id="recordBitrateSelect">
                <option value="5000000">Low (5 Mbps)</option>
                <option value="10000000" selected>Medium (10 Mbps)</option>
                <option value="20000000">High (20 Mbps)</option>
                <option value="35000000">Ultra (35 Mbps)</option>
            </select>

            <label style="margin-top: 8px;">Duration</label>
            <select id="recordDurationSelect">
                <option value="5">5 seconds</option>
                <option value="10" selected>10 seconds</option>
                <option value="15">15 seconds</option>
                <option value="20">20 seconds</option>
                <option value="30">30 seconds</option>
                <option value="custom">Custom</option>
            </select>
            <div id="customDurationInput" class="hidden" style="margin-top: 8px;">
                <input type="number" id="customDuration" placeholder="Seconds" value="20" min="1" max="300">
            </div>

            <div class="checkbox-row" style="margin-top: 12px;">
                <input type="checkbox" id="recordFromStartCheckbox" checked>
                <label for="recordFromStartCheckbox">Record from start</label>
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="recordPixelRatioCheckbox">
                <label for="recordPixelRatioCheckbox">Use devicePixelRatio</label>
            </div>

            <div class="button-row" style="margin-top: 8px;">
                <button class="record" id="startRecordBtn">Start Recording</button>
                <button class="secondary" id="stopRecordBtn" disabled>Stop</button>
            </div>
            <div id="recordStatus" class="record-status idle">Ready to record</div>
        </div>

        <div class="control-group">
            <div class="checkbox-row">
                <input type="checkbox" id="debugCheckbox">
                <label for="debugCheckbox">Show Debug Info</label>
            </div>
        </div>

        <div class="control-group">
            <h3>Keyboard Shortcuts</h3>
            <div style="font-size: 12px; color: #888; line-height: 1.6;">
                <strong>Click/Drag:</strong> Draw<br>
                <strong>+/-:</strong> Speed up/down<br>
                <strong>0:</strong> Pause/Resume<br>
                <strong>C:</strong> Reset default<br>
                <strong>R:</strong> Clear all<br>
                <strong>S:</strong> Export SVG<br>
                <strong>Esc:</strong> Stop recording
            </div>
        </div>
    </div>

    <script>
        // Format presets
        const FORMAT_PRESETS = {
            LANDSCAPE_16_9: { width: 1920, height: 1080 },
            PORTRAIT_9_16: { width: 1080, height: 1920 }
        };
        let currentFormat = 'LANDSCAPE_16_9';

        // Get the base resolution for the current format (not the preview size)
        function getFormatBaseResolution() {
            if (currentFormat === 'PORTRAIT_9_16') {
                return { w: 1080, h: 1920 };
            } else {
                return { w: 1920, h: 1080 };
            }
        }

        // Compute a scale factor (unit) so rendering looks identical at any resolution.
        // Uses the format's base resolution as reference (1920x1080 or 1080x1920).
        // All fixed-pixel constants in renderScene should be multiplied by this unit.
        function getUnit(w, h) {
            const base = getFormatBaseResolution();
            const unit = Math.min(w / base.w, h / base.h);
            // Clamp to avoid extreme scaling at very small or large sizes
            return constrain(unit, 0.5, 3.0);
        }

        // Get the simulation resolution for the current format.
        // All Chaikin caches are built in sim-space for consistent density.
        function getSimResolution() {
            return getFormatBaseResolution(); // Same as base: 1920x1080 or 1080x1920
        }

        // Map points from simulation space to target render space.
        // This ensures consistent point density regardless of render target size.
        function mapPointsToTarget(simPoints, targetW, targetH, simW, simH) {
            const scaleX = targetW / simW;
            const scaleY = targetH / simH;
            let mapped = [];
            for (let p of simPoints) {
                mapped.push(createVector(p.x * scaleX, p.y * scaleY));
            }
            return mapped;
        }

        // Map a single point from sim-space to target-space
        function mapPointToTarget(simPoint, targetW, targetH, simW, simH) {
            const scaleX = targetW / simW;
            const scaleY = targetH / simH;
            return createVector(simPoint.x * scaleX, simPoint.y * scaleY);
        }

        // Noise variables
        let noise_init_x = 0;
        let noise_init_y = 1000;
        let noise_init_r = 2000;
        let noise_delta_space = 1;
        let noise_delta_time = 0.0003;
        let noise_space = 0;
        let noise_time = 0;

        let seg_limit = 3;
        let seg_limit_sq = seg_limit * seg_limit;

        // Colors
        let linesStart, linesEnd, drops1, drops2, drops3;
        let numLines = 17;

        // Normalized first points (0..1 range)
        let first_points = [
            { x: -0.206, y: 0.652 },
            { x: 0.112, y: 0.753 },
            { x: 0.263, y: 0.534 },
            { x: 0.207, y: 0.290 },
            { x: 0.472, y: 0.560 },
            { x: 0.779, y: 0.422 },
            { x: 0.846, y: 0.812 },
            { x: 0.999, y: 0.530 },
            { x: 0.893, y: 0.000 }
        ];

        // Normalized points storage (0..1 range)
        let pointsNorm = [];
        let head = 1;
        let max_show = 2500;

        let dirty = true;
        // Cache is always built in simulation-space for consistent density
        let preparedCacheSim = [];

        let animSpeed = 1;
        let prevSpeed = 1;
        let tailSmooth = 0;

        // Vignette text
        let vignetteLine1 = "School of";
        let vignetteLine2 = "Tomorrow's AI";
        let vignetteStartTime = null;
        let typewriterSpeed = 80;

        // Circle transition
        let circleTransitionStart = null;
        let circleTransitionDuration = 1500;
        // Circle start position stored in sim-space for consistency
        let circleStartPosSim = null;

        // Debug mode
        let showDebug = false;

        // Export options
        let includeBackground = true;
        let includeSplashes = true;

        // Store current frame data for export
        let currentReducedPoints = [];
        let currentTail = 0;
        let animationComplete = false;

        // Canvas reference for recording
        let canvasElement = null;

        // Recording state
        let isRecording = false;
        let mediaRecorder = null;
        let recordedChunks = [];
        let recordingStartTime = null;
        let recordingDuration = 10; // seconds (default 10s)
        let recordingFps = 30;
        let recordingTimer = null;
        let countdownInterval = null;
        let recordFromStart = true;

        // Recording quality settings
        let recordResolution = 'match'; // 'match' or 'WxH' string
        let recordBitrate = 10000000; // 10 Mbps default
        let recordUsePixelRatio = false;

        // Store original canvas state for restoration after recording
        let originalCanvasWidth = 0;
        let originalCanvasHeight = 0;
        let originalPixelDensity = 1;
        let recordingWidth = 0;
        let recordingHeight = 0;

        // ============================================
        // SVG Library Check
        // ============================================
        function isSvgLibReady() {
            // Check for p5.js-svg markers
            const hasSVGConst = typeof SVG !== 'undefined';
            const hasRendererSVG = typeof p5 !== 'undefined' &&
                                   typeof p5.RendererSVG !== 'undefined';
            const hasPrototypeSVG = typeof p5 !== 'undefined' &&
                                    p5.prototype &&
                                    typeof p5.prototype.SVG !== 'undefined';

            return hasSVGConst || hasRendererSVG || hasPrototypeSVG;
        }

        function updateSvgStatus() {
            const exportBtn = document.getElementById('exportBtn');
            const statusEl = document.getElementById('exportStatus');

            const ready = isSvgLibReady();

            console.log('SVG Library Check:', {
                ready: ready,
                'window.SVG': typeof SVG !== 'undefined' ? SVG : 'undefined',
                'p5.RendererSVG': typeof p5 !== 'undefined' && p5.RendererSVG ? 'exists' : 'undefined',
                'p5.prototype.SVG': typeof p5 !== 'undefined' && p5.prototype && p5.prototype.SVG ? 'exists' : 'undefined'
            });

            if (!ready) {
                exportBtn.disabled = true;
                statusEl.className = 'export-status warning';
                statusEl.textContent = 'SVG library not loaded. Check network/CDN.';
                statusEl.classList.remove('hidden');
            } else {
                exportBtn.disabled = false;
                statusEl.classList.add('hidden');
            }
        }

        function showExportStatus(message, type) {
            const statusEl = document.getElementById('exportStatus');
            statusEl.className = `export-status ${type}`;
            statusEl.textContent = message;
            statusEl.classList.remove('hidden');

            // Auto-hide success messages after 3 seconds
            if (type === 'success') {
                setTimeout(() => {
                    statusEl.classList.add('hidden');
                }, 3000);
            }
        }

        // ============================================
        // Compute stage size to fit aspect ratio
        // ============================================
        function computeStageSize() {
            const preset = FORMAT_PRESETS[currentFormat];
            const aspectRatio = preset.width / preset.height;

            const stageContainer = document.getElementById('stage');
            const availableWidth = stageContainer.clientWidth - 40;
            const availableHeight = stageContainer.clientHeight - 40;

            let stageWidth, stageHeight;

            if (availableWidth / availableHeight > aspectRatio) {
                stageHeight = availableHeight;
                stageWidth = stageHeight * aspectRatio;
            } else {
                stageWidth = availableWidth;
                stageHeight = stageWidth / aspectRatio;
            }

            return { width: Math.floor(stageWidth), height: Math.floor(stageHeight) };
        }

        // Denormalize points to pixel space for a given width/height
        function denormalizePointsForSize(normPoints, w, h) {
            let pixelPoints = [];
            for (let p of normPoints) {
                pixelPoints.push(createVector(p.x * w, p.y * h));
            }
            return pixelPoints;
        }

        // Denormalize points to pixel space (current canvas)
        function denormalizePoints(normPoints) {
            return denormalizePointsForSize(normPoints, width, height);
        }

        function setup() {
            const size = computeStageSize();
            let canvas = createCanvas(size.width, size.height);
            canvas.parent('stage');
            pixelDensity(1);

            // Store canvas element reference for recording
            canvasElement = canvas.elt;

            linesStart = color(164, 232, 207);
            linesEnd = color(210, 163, 169);
            drops1 = color(119, 58, 239);
            drops2 = color('#ea7dff');
            drops3 = color(255, 108, 167);

            initPoints();
            setupControls();

            // Check SVG availability after a small delay to ensure scripts are loaded
            setTimeout(updateSvgStatus, 100);

            // Check recording support
            setTimeout(checkRecordingSupport, 100);
        }

        function windowResized() {
            const size = computeStageSize();
            resizeCanvas(size.width, size.height);
            dirty = true;
        }

        function setupControls() {
            // Format select
            document.getElementById('formatSelect').addEventListener('change', (e) => {
                currentFormat = e.target.value;
                const size = computeStageSize();
                resizeCanvas(size.width, size.height);
                dirty = true;
            });

            // Speed slider
            const speedSlider = document.getElementById('speedSlider');
            const speedValue = document.getElementById('speedValue');
            speedSlider.addEventListener('input', (e) => {
                animSpeed = parseFloat(e.target.value);
                prevSpeed = animSpeed > 0 ? animSpeed : prevSpeed;
                speedValue.textContent = animSpeed.toFixed(1);
            });

            // Max show slider
            const maxShowSlider = document.getElementById('maxShowSlider');
            const maxShowValue = document.getElementById('maxShowValue');
            maxShowSlider.addEventListener('input', (e) => {
                max_show = parseInt(e.target.value);
                maxShowValue.textContent = max_show;
            });

            // Num lines slider
            const numLinesSlider = document.getElementById('numLinesSlider');
            const numLinesValue = document.getElementById('numLinesValue');
            numLinesSlider.addEventListener('input', (e) => {
                numLines = parseInt(e.target.value);
                numLinesValue.textContent = numLines;
            });

            // Vignette text inputs
            document.getElementById('line1Input').addEventListener('input', (e) => {
                vignetteLine1 = e.target.value;
            });
            document.getElementById('line2Input').addEventListener('input', (e) => {
                vignetteLine2 = e.target.value;
            });

            // Reset button
            document.getElementById('resetBtn').addEventListener('click', () => {
                resetToDefault();
            });

            // Clear button
            document.getElementById('clearBtn').addEventListener('click', () => {
                clearAll();
            });

            // Debug checkbox
            document.getElementById('debugCheckbox').addEventListener('change', (e) => {
                showDebug = e.target.checked;
            });

            // Export size select
            document.getElementById('exportSizeSelect').addEventListener('change', (e) => {
                const customInputs = document.getElementById('customSizeInputs');
                if (e.target.value === 'custom') {
                    customInputs.classList.remove('hidden');
                } else {
                    customInputs.classList.add('hidden');
                }
            });

            // Export checkboxes
            document.getElementById('includeBackground').addEventListener('change', (e) => {
                includeBackground = e.target.checked;
            });
            document.getElementById('includeSplashes').addEventListener('change', (e) => {
                includeSplashes = e.target.checked;
            });

            // Export button
            document.getElementById('exportBtn').addEventListener('click', () => {
                exportSVG();
            });

            // Recording controls
            document.getElementById('recordResolutionSelect').addEventListener('change', (e) => {
                recordResolution = e.target.value;
            });

            document.getElementById('recordFpsSelect').addEventListener('change', (e) => {
                recordingFps = parseInt(e.target.value);
            });

            document.getElementById('recordBitrateSelect').addEventListener('change', (e) => {
                recordBitrate = parseInt(e.target.value);
            });

            document.getElementById('recordDurationSelect').addEventListener('change', (e) => {
                const customInput = document.getElementById('customDurationInput');
                if (e.target.value === 'custom') {
                    customInput.classList.remove('hidden');
                    recordingDuration = parseInt(document.getElementById('customDuration').value) || 20;
                } else {
                    customInput.classList.add('hidden');
                    recordingDuration = parseInt(e.target.value);
                }
            });

            document.getElementById('customDuration').addEventListener('input', (e) => {
                recordingDuration = parseInt(e.target.value) || 20;
            });

            document.getElementById('recordFromStartCheckbox').addEventListener('change', (e) => {
                recordFromStart = e.target.checked;
            });

            document.getElementById('recordPixelRatioCheckbox').addEventListener('change', (e) => {
                recordUsePixelRatio = e.target.checked;
            });

            document.getElementById('startRecordBtn').addEventListener('click', () => {
                startRecording();
            });

            document.getElementById('stopRecordBtn').addEventListener('click', () => {
                stopRecording();
            });
        }

        function resetToDefault() {
            pointsNorm = [];
            head = 1;
            tailSmooth = 0;
            dirty = true;
            circleTransitionStart = null;
            circleStartPosSim = null;
            vignetteStartTime = null;
            animationComplete = false;
            initPoints();
            console.log('Canvas reset to default');
        }

        function clearAll() {
            pointsNorm = [];
            head = 1;
            tailSmooth = 0;
            dirty = true;
            circleTransitionStart = null;
            circleStartPosSim = null;
            vignetteStartTime = null;
            animationComplete = false;
            console.log('Canvas cleared');
        }

        function draw() {
            background(230);
            noise_time += noise_delta_time;

            // Get simulation resolution for consistent cache density
            const sim = getSimResolution();

            // Rebuild cache in sim-space if dirty
            if (dirty) {
                let pointsSim = denormalizePointsForSize(pointsNorm, sim.w, sim.h);
                preparedCacheSim = chaikinReduce(pointsSim, seg_limit_sq);
                dirty = false;
            }

            // Animation logic operates on sim-space cache (stable point count)
            let count = preparedCacheSim.length;
            head = min(head, count);
            let targetTail = max(0, head - max_show);
            tailSmooth = lerp(tailSmooth, targetTail, 0.1);
            let tail = floor(tailSmooth);

            // Slice in sim-space, then map to current canvas size
            let reducedSim = preparedCacheSim.slice(tail, head);
            let reduced = mapPointsToTarget(reducedSim, width, height, sim.w, sim.h);

            head += animSpeed;
            head = min(head, count);

            // Store for export
            currentReducedPoints = reduced;
            currentTail = tail;
            animationComplete = (head >= count && count > 0);

            // Render the scene to main canvas (null = use global drawing functions)
            renderScene(null, width, height, reduced, tail, count, false);
        }

        // ============================================
        // Unified Render Scene
        // ============================================
        // target: graphics context or null for main canvas
        // w, h: dimensions
        // reduced: array of reduced points to draw
        // tail: current tail index
        // count: total point count
        // isExport: if true, render static export (no animation, full text)
        function renderScene(target, w, h, reduced, tail, count, isExport) {
            // Helper to call drawing functions on target or globally
            const g = target || window;
            const isGlobal = target === null;

            // Compute unit scale so fixed-pixel constants render identically at any resolution
            const u = getUnit(w, h);

            // Draw lines
            if (isGlobal) noFill(); else g.noFill();
            if (isGlobal) push(); else g.push();

            for (let i = 0; i < numLines; i++) {
                const lineColor = lerpColor(linesStart, linesEnd, map(i, 0, numLines - 1, 0, 1));
                if (isGlobal) {
                    stroke(lineColor);
                    strokeWeight(2 * u);
                } else {
                    g.stroke(lineColor);
                    g.strokeWeight(2 * u);
                }
                drawLineToContext(target, reduced);
                const yOffset = isExport ? 0 : 2.0 * u * sin(millis() / 5000.0);
                if (isGlobal) translate(18.0 * u, yOffset); else g.translate(18.0 * u, yOffset);
            }
            if (isGlobal) pop(); else g.pop();

            // Draw splashes (skip if export and includeSplashes is false)
            if (!isExport || includeSplashes) {
                if (isGlobal) push(); else g.push();
                if (isGlobal) scale(1.5); else g.scale(1.5);
                if (isGlobal) translate(0, -h / 8); else g.translate(0, -h / 8);
                if (isGlobal) noStroke(); else g.noStroke();

                // Splash parameters scaled by unit for consistent appearance
                let localNoiseSpace = 0 + tail * noise_delta_space;
                if (isGlobal) fill(drops1); else g.fill(drops1);
                drawSplashToContext(target, reduced, 60 * u, 120 * u, 1 * u, 10 * u, localNoiseSpace);

                localNoiseSpace = 100 + tail * noise_delta_space;
                if (isGlobal) translate(-20 * u, 60 * u); else g.translate(-20 * u, 60 * u);
                if (isGlobal) fill(drops2); else g.fill(drops2);
                drawSplashToContext(target, reduced, 60 * u, 120 * u, 1 * u, 8 * u, localNoiseSpace);

                localNoiseSpace = 200 + tail * noise_delta_space;
                if (isGlobal) translate(-20 * u, 60 * u); else g.translate(-20 * u, 60 * u);
                if (isGlobal) fill(drops3); else g.fill(drops3);
                drawSplashToContext(target, reduced, 60 * u, 120 * u, 2 * u, 6 * u, localNoiseSpace);

                if (isGlobal) pop(); else g.pop();
            }

            // Circle and text (only if animation complete or exporting)
            const showVignette = isExport || (head >= count && count > 0);

            if (showVignette) {
                // Initialize circle transition for live view
                // Store start position in sim-space for consistency across resolutions
                if (!isExport && circleTransitionStart === null) {
                    circleTransitionStart = millis();
                    const sim = getSimResolution();
                    if (preparedCacheSim.length > 0) {
                        circleStartPosSim = preparedCacheSim[preparedCacheSim.length - 1].copy();
                    } else {
                        circleStartPosSim = createVector(sim.w / 2, sim.h / 2);
                    }
                }

                let elapsed = isExport ? circleTransitionDuration + 10000 : millis() - circleTransitionStart;

                function easeOutCubic(t) {
                    return 1 - pow(1 - t, 3);
                }

                let centerX = w / 2;
                let centerY = h / 2;
                let minRadius = 5 * u;

                // Deterministic sizing based on orientation
                const isPortrait = currentFormat === 'PORTRAIT_9_16' || h > w;
                const kPortrait = 0.50;
                const kLandscape = 0.42;
                const base = isPortrait ? w : h;
                let maxRadius = base * (isPortrait ? kPortrait : kLandscape);

                // Safety margin scaled by unit for consistent padding across resolutions
                const safetyMargin = 40 * u;
                const maxAllowedRadius = min(w, h) / 2 - safetyMargin;
                maxRadius = min(maxRadius, maxAllowedRadius);
                maxRadius = constrain(maxRadius, 140 * u, maxAllowedRadius);

                if (isGlobal) push(); else g.push();
                if (isGlobal) noStroke(); else g.noStroke();

                let circleX, circleY, radius, opacity;

                if (elapsed < circleTransitionDuration && !isExport) {
                    // Map circle start position from sim-space to target space
                    const sim = getSimResolution();
                    const circleStartPos = circleStartPosSim
                        ? mapPointToTarget(circleStartPosSim, w, h, sim.w, sim.h)
                        : createVector(centerX, centerY);

                    let moveProgress = min(elapsed / 800, 1);
                    let easedMove = easeOutCubic(moveProgress);
                    circleX = lerp(circleStartPos.x, centerX, easedMove);
                    circleY = lerp(circleStartPos.y, centerY, easedMove);

                    let growProgress = max(0, (elapsed - 800) / 700);
                    let easedGrow = easeOutCubic(min(growProgress, 1));
                    radius = lerp(minRadius, maxRadius, easedGrow);

                    let progress = elapsed / circleTransitionDuration;
                    opacity = lerp(0.3, 0.8, easeOutCubic(progress));
                } else {
                    circleX = centerX;
                    circleY = centerY;
                    // Pulse amount scaled by unit for consistent subtle animation
                    let pulseAmount = isExport ? 0 : sin(millis() / 1000) * (10 * u);
                    radius = maxRadius + pulseAmount;
                    opacity = 0.8;
                }

                const circleColor = color(234, 125, 255, opacity * 255);
                if (isGlobal) {
                    fill(circleColor);
                    ellipse(circleX, circleY, radius * 2, radius * 2);
                } else {
                    g.fill(circleColor);
                    g.ellipse(circleX, circleY, radius * 2, radius * 2);
                }
                if (isGlobal) pop(); else g.pop();

                // Typewriter text
                const showText = isExport || elapsed >= circleTransitionDuration;
                if (showText) {
                    if (!isExport && vignetteStartTime === null) {
                        vignetteStartTime = millis();
                    }

                    let textElapsed = isExport ? 100000 : millis() - vignetteStartTime;
                    let totalChars = vignetteLine1.length + vignetteLine2.length;
                    let charsToShow = isExport ? totalChars : floor(textElapsed / typewriterSpeed);
                    charsToShow = min(charsToShow, totalChars);

                    let fadeIn = isExport ? 1 : min(textElapsed / 500, 1);

                    if (isGlobal) push(); else g.push();
                    if (isGlobal) {
                        textFont('Space Grotesk');
                        textStyle(BOLD);
                    } else {
                        g.textFont('Space Grotesk');
                        g.textStyle(BOLD);
                    }

                    const isPortraitText = currentFormat === 'PORTRAIT_9_16' || h > w;
                    const baseFont = isPortraitText ? w : h;
                    let fontSize = isPortraitText ? baseFont / 10 : baseFont / 9;
                    fontSize = constrain(fontSize, 28, 96);

                    if (isGlobal) {
                        textSize(fontSize);
                        textAlign(CENTER, CENTER);
                        fill(255, 255, 255, fadeIn * 255);
                        noStroke();
                    } else {
                        g.textSize(fontSize);
                        g.textAlign(CENTER, CENTER);
                        g.fill(255, 255, 255, fadeIn * 255);
                        g.noStroke();
                    }

                    let lineSpacing = fontSize * 0.9;
                    let line1Y = h / 2 - lineSpacing / 2;
                    let line2Y = h / 2 + lineSpacing / 2;

                    let line1Chars = min(charsToShow, vignetteLine1.length);
                    let displayLine1 = vignetteLine1.substring(0, line1Chars);

                    if (!isExport && charsToShow < vignetteLine1.length) {
                        let cursorBlink = floor(millis() / 500) % 2 === 0;
                        if (cursorBlink) {
                            displayLine1 += "|";
                        }
                    }

                    if (isGlobal) {
                        text(displayLine1, w / 2, line1Y);
                    } else {
                        g.text(displayLine1, w / 2, line1Y);
                    }

                    if (charsToShow > vignetteLine1.length) {
                        let line2Chars = min(charsToShow - vignetteLine1.length, vignetteLine2.length);
                        let displayLine2 = vignetteLine2.substring(0, line2Chars);

                        if (!isExport && charsToShow < totalChars) {
                            let cursorBlink = floor(millis() / 500) % 2 === 0;
                            if (cursorBlink) {
                                displayLine2 += "|";
                            }
                        }

                        if (isGlobal) {
                            text(displayLine2, w / 2, line2Y);
                        } else {
                            g.text(displayLine2, w / 2, line2Y);
                        }
                    }

                    if (isGlobal) pop(); else g.pop();
                }
            } else if (!isExport) {
                circleTransitionStart = null;
                circleStartPosSim = null;
                vignetteStartTime = null;
            }

            // Debug info (only for main canvas, not export)
            if (!isExport && showDebug) {
                fill(0);
                noStroke();
                // Debug text size scaled by unit for readability at any resolution
                textSize(14 * u);
                textAlign(LEFT, BASELINE);
                textFont('Inter');
                textStyle(NORMAL);
                let speedText = animSpeed === 0 ? 'PAUSED' : animSpeed.toFixed(1) + 'x';
                const debugX = 20 * u;
                const debugSpacing = 20 * u;
                text(`Points: ${reduced.length} | Total: ${pointsNorm.length}`, debugX, h - 5 * debugSpacing);
                text(`Head: ${Math.floor(head)} | Tail: ${tail}`, debugX, h - 4 * debugSpacing);
                text(`Speed: ${speedText}`, debugX, h - 3 * debugSpacing);
                text(`Canvas: ${w}x${h}`, debugX, h - 2 * debugSpacing);
                text(`Format: ${currentFormat}`, debugX, h - debugSpacing);
            }
        }

        function drawLineToContext(target, pts) {
            if (pts.length < 2) return;
            const isGlobal = target === null;

            if (isGlobal) {
                beginShape();
                for (let pt of pts) {
                    vertex(pt.x, pt.y);
                }
                endShape();
            } else {
                target.beginShape();
                for (let pt of pts) {
                    target.vertex(pt.x, pt.y);
                }
                target.endShape();
            }
        }

        function drawSplashToContext(target, pts, r_x, r_y, r_min, r_max, startNoiseSpace) {
            if (pts.length < 2) return;
            const isGlobal = target === null;
            let localNoiseSpace = startNoiseSpace;

            for (let i = 1; i < pts.length; i++) {
                if (isGlobal) {
                    push();
                    translate(pts[i-1].x, pts[i-1].y);
                    rotate(p5.Vector.sub(pts[i-1], pts[i]).heading());
                } else {
                    target.push();
                    target.translate(pts[i-1].x, pts[i-1].y);
                    target.rotate(p5.Vector.sub(pts[i-1], pts[i]).heading());
                }

                splashToContext(target, r_x, r_y, r_min, r_max, localNoiseSpace);
                localNoiseSpace += noise_delta_space;

                if (isGlobal) pop(); else target.pop();
            }
        }

        function splashToContext(target, r_x, r_y, r_min, r_max, noiseSpaceVal) {
            const isGlobal = target === null;
            let r = map(noise(noise_init_r + noise_time, noiseSpaceVal), 0, 1, r_min, r_max);
            let dx = map(noise(noise_init_x + noise_time, noiseSpaceVal), 0, 1, -r_x, r_x);
            let dy = map(noise(noise_init_y + noise_time, noiseSpaceVal), 0, 1, -r_y, r_y);

            if (isGlobal) {
                ellipse(dx, dy, r, r);
            } else {
                target.ellipse(dx, dy, r, r);
            }
        }

        // ============================================
        // Export Functions
        // ============================================
        function getExportDimensions() {
            const select = document.getElementById('exportSizeSelect').value;
            switch (select) {
                case 'match':
                    return { width: width, height: height };
                case 'landscape':
                    return { width: 1920, height: 1080 };
                case 'portrait':
                    return { width: 1080, height: 1920 };
                case 'custom':
                    return {
                        width: parseInt(document.getElementById('customWidth').value) || 1920,
                        height: parseInt(document.getElementById('customHeight').value) || 1080
                    };
                default:
                    return { width: width, height: height };
            }
        }

        function makeFilename() {
            const dims = getExportDimensions();
            const timestamp = Date.now();
            return `school-of-tomorrows-ai-vignette_${currentFormat}_${dims.width}x${dims.height}_${timestamp}.svg`;
        }

        // Helper to find the actual SVG node from p5.js-svg graphics buffer
        function getSVGNode(pg) {
            // Direct check: pg.elt is the SVG element
            if (pg?.elt && pg.elt instanceof SVGSVGElement) return pg.elt;

            // Check renderer.svg (common in p5.js-svg)
            const r = pg?._renderer;
            if (r?.svg instanceof SVGSVGElement) return r.svg;
            if (r?.svg?.elt instanceof SVGSVGElement) return r.svg.elt;
            if (r?.elt instanceof SVGSVGElement) return r.elt;

            // Fallback: look for SVG in the DOM that was just created
            if (r?.svg && r.svg.nodeName === 'svg') return r.svg;

            return null;
        }

        function exportSVG() {
            // Debug logging
            console.log("=== SVG Export Started ===");
            console.log("SVG ready?", isSvgLibReady());
            console.log("window.SVG:", typeof SVG !== 'undefined' ? SVG : 'undefined');
            console.log("p5.RendererSVG:", typeof p5 !== 'undefined' && p5.RendererSVG ? 'exists' : 'undefined');

            if (!isSvgLibReady()) {
                const msg = 'SVG library not loaded. Cannot export.';
                console.error(msg);
                showExportStatus(msg, 'error');
                return;
            }

            try {
                const dims = getExportDimensions();
                const exportW = dims.width;
                const exportH = dims.height;

                console.log(`Creating SVG graphics: ${exportW}x${exportH}`);

                // Create SVG graphics buffer
                let pg = createGraphics(exportW, exportH, SVG);

                // Draw background if enabled (as a filled rect, not background())
                if (includeBackground) {
                    pg.fill(230);
                    pg.noStroke();
                    pg.rect(0, 0, exportW, exportH);
                }

                // Use sim-space cache and map to export dimensions for consistent density
                const sim = getSimResolution();

                // Rebuild sim-space cache if needed
                if (preparedCacheSim.length === 0 || dirty) {
                    let pointsSim = denormalizePointsForSize(pointsNorm, sim.w, sim.h);
                    preparedCacheSim = chaikinReduce(pointsSim, seg_limit_sq);
                    dirty = false;
                }

                // Use all points for export (show complete drawing)
                let exportTail = max(0, preparedCacheSim.length - max_show);
                let exportReducedSim = preparedCacheSim.slice(exportTail);

                // Map from sim-space to export dimensions
                let exportReduced = mapPointsToTarget(exportReducedSim, exportW, exportH, sim.w, sim.h);

                console.log(`Rendering ${exportReduced.length} points to SVG (sim: ${sim.w}x${sim.h}, export: ${exportW}x${exportH})`);

                // Render scene to SVG
                renderScene(pg, exportW, exportH, exportReduced, exportTail, preparedCacheSim.length, true);

                // Debug: log structure of pg to find SVG node
                console.log("pg.elt tag:", pg?.elt?.tagName,
                            "renderer:", pg?._renderer,
                            "renderer.svg:", pg?._renderer?.svg,
                            "renderer.elt:", pg?._renderer?.elt);

                // Get the actual SVG node using helper
                const svgNode = getSVGNode(pg);

                if (!svgNode) {
                    // Additional debug info
                    console.error("Could not find SVG node. Structure:", {
                        elt: pg?.elt,
                        eltTag: pg?.elt?.tagName,
                        renderer: pg?._renderer,
                        rendererSvg: pg?._renderer?.svg,
                        rendererElt: pg?._renderer?.elt
                    });
                    throw new Error('Could not locate SVG node in graphics buffer. The p5.js-svg renderer may not be working correctly.');
                }

                console.log("SVG node obtained:", svgNode.tagName, svgNode);

                // Serialize the SVG
                const serializer = new XMLSerializer();
                let svgText = serializer.serializeToString(svgNode);

                // Ensure viewBox is set
                if (!svgText.includes('viewBox')) {
                    svgText = svgText.replace(
                        '<svg',
                        `<svg viewBox="0 0 ${exportW} ${exportH}"`
                    );
                }

                // Ensure width/height are set
                if (!svgText.includes('width=')) {
                    svgText = svgText.replace(
                        '<svg',
                        `<svg width="${exportW}" height="${exportH}"`
                    );
                }

                // Create blob and download
                const blob = new Blob([svgText], { type: "image/svg+xml;charset=utf-8" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = makeFilename();
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                // Clean up
                pg.remove();

                console.log('SVG exported successfully:', a.download);
                showExportStatus(`Exported: ${a.download}`, 'success');

            } catch (e) {
                const errorMsg = `Export failed: ${e.message || e}`;
                console.error('SVG export failed:', e);
                showExportStatus(errorMsg, 'error');
            }
        }

        // ============================================
        // Video Recording Functions
        // ============================================
        function checkRecordingSupport() {
            const startBtn = document.getElementById('startRecordBtn');
            const statusEl = document.getElementById('recordStatus');

            const hasMediaRecorder = typeof MediaRecorder !== 'undefined';
            const hasCaptureStream = canvasElement && typeof canvasElement.captureStream === 'function';

            console.log('Recording support check:', {
                hasMediaRecorder,
                hasCaptureStream,
                canvasElement: !!canvasElement
            });

            if (!hasMediaRecorder || !hasCaptureStream) {
                startBtn.disabled = true;
                statusEl.className = 'record-status error';
                statusEl.textContent = 'Recording not supported in this browser';
            }
        }

        function getSupportedMimeType() {
            const types = [
                'video/webm;codecs=vp9',
                'video/webm;codecs=vp8',
                'video/webm'
            ];

            for (const type of types) {
                if (MediaRecorder.isTypeSupported(type)) {
                    console.log('Using mime type:', type);
                    return type;
                }
            }
            return 'video/webm';
        }

        function lockControlsForRecording(lock) {
            const elementsToLock = [
                'formatSelect',
                'speedSlider',
                'maxShowSlider',
                'numLinesSlider',
                'line1Input',
                'line2Input',
                'resetBtn',
                'clearBtn',
                'exportBtn',
                'recordResolutionSelect',
                'recordFpsSelect',
                'recordBitrateSelect',
                'recordDurationSelect',
                'customDuration',
                'recordFromStartCheckbox',
                'recordPixelRatioCheckbox'
            ];

            elementsToLock.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.disabled = lock;
                }
            });

            // Also prevent drawing during recording
            // (handled by checking isRecording in mousePressed/mouseDragged)
        }

        function updateRecordStatus(message, statusClass) {
            const statusEl = document.getElementById('recordStatus');
            statusEl.className = `record-status ${statusClass}`;
            statusEl.textContent = message;
        }

        function resetAnimationForRecording() {
            console.log('Resetting animation for recording...');

            // Reset animation timeline
            head = 1;
            tailSmooth = 0;

            // Reset vignette/transition state
            circleTransitionStart = null;
            circleStartPosSim = null;
            vignetteStartTime = null;

            // Reset noise time for deterministic playback
            const recordSeed = Date.now();
            randomSeed(recordSeed);
            noiseSeed(recordSeed);
            noise_time = 0;

            // Rebuild the cache in sim-space (not current canvas size)
            const sim = getSimResolution();
            let pointsSim = denormalizePointsForSize(pointsNorm, sim.w, sim.h);
            preparedCacheSim = chaikinReduce(pointsSim, seg_limit_sq);
            dirty = false;

            // Ensure animation is not paused
            if (animSpeed === 0) {
                animSpeed = prevSpeed > 0 ? prevSpeed : 1;
                updateSpeedSlider();
            }

            console.log('Animation reset complete. Head:', head, 'Cache length:', preparedCacheSim.length);
        }

        async function startRecording() {
            if (isRecording) return;

            try {
                console.log('=== Starting Recording ===');
                console.log(`Resolution: ${recordResolution}, FPS: ${recordingFps}, Duration: ${recordingDuration}s`);
                console.log(`Bitrate: ${recordBitrate / 1000000} Mbps, From start: ${recordFromStart}, PixelRatio: ${recordUsePixelRatio}`);

                // Disable start button immediately to prevent double-clicks
                document.getElementById('startRecordBtn').disabled = true;
                updateRecordStatus('Preparing...', 'idle');

                // Store original canvas state (preview size)
                originalCanvasWidth = width;
                originalCanvasHeight = height;
                originalPixelDensity = pixelDensity();

                // Store current CSS display size so preview doesn't visually change during recording
                const previewCssW = canvasElement.getBoundingClientRect().width;
                const previewCssH = canvasElement.getBoundingClientRect().height;
                console.log(`[REC] Preview CSS size: ${previewCssW}x${previewCssH}`);

                // Determine recording resolution
                // If "Match Format" is selected, use the format's base resolution (not the preview size)
                if (recordResolution === 'match') {
                    const baseRes = getFormatBaseResolution();
                    recordingWidth = baseRes.w;
                    recordingHeight = baseRes.h;
                    console.log(`[REC] Using format base resolution: ${recordingWidth}x${recordingHeight}`);
                } else {
                    const [w, h] = recordResolution.split('x').map(Number);
                    recordingWidth = w;
                    recordingHeight = h;
                    console.log(`[REC] Using explicit resolution: ${recordingWidth}x${recordingHeight}`);
                }

                console.log(`[REC] format: ${currentFormat}, recordW/H: ${recordingWidth}x${recordingHeight}, preview buffer: ${width}x${height}`);

                // Set pixel density before resizing
                if (recordUsePixelRatio) {
                    const dpr = Math.min(window.devicePixelRatio || 1, 2);
                    pixelDensity(dpr);
                    console.log(`[REC] Setting pixelDensity to ${dpr}`);
                } else {
                    pixelDensity(1);
                }

                // Always resize canvas to recording resolution
                console.log(`[REC] Resizing canvas from ${width}x${height} to ${recordingWidth}x${recordingHeight}`);
                resizeCanvas(recordingWidth, recordingHeight);
                dirty = true;

                // Lock CSS size so the on-screen preview doesn't jump during high-res recording
                canvasElement.style.width = previewCssW + 'px';
                canvasElement.style.height = previewCssH + 'px';
                console.log(`[REC] Locked CSS size to ${previewCssW}x${previewCssH}`);

                // Cache is in sim-space, no need to rebuild for canvas resize
                // Just ensure it's built if dirty
                if (dirty) {
                    const sim = getSimResolution();
                    let pointsSim = denormalizePointsForSize(pointsNorm, sim.w, sim.h);
                    preparedCacheSim = chaikinReduce(pointsSim, seg_limit_sq);
                    dirty = false;
                }

                // Log actual canvas element dimensions
                console.log(`[REC] canvas.elt dimensions: ${canvasElement.width}x${canvasElement.height}`);

                // Reset animation if "Record from start" is checked
                if (recordFromStart) {
                    resetAnimationForRecording();
                }

                // Wait 2 animation frames after resizing before capturing stream
                await new Promise(resolve => requestAnimationFrame(resolve));
                await new Promise(resolve => requestAnimationFrame(resolve));

                console.log(`Final recording canvas size: ${width}x${height}, pixelDensity: ${pixelDensity()}`);

                // Get canvas stream
                const stream = canvasElement.captureStream(recordingFps);
                const mimeType = getSupportedMimeType();

                console.log('Stream tracks:', stream.getTracks().length);
                console.log('Mime type:', mimeType);
                console.log('Bitrate:', recordBitrate, 'bps');

                // Create MediaRecorder with bitrate
                const recorderOptions = {
                    mimeType: mimeType,
                    videoBitsPerSecond: recordBitrate
                };
                mediaRecorder = new MediaRecorder(stream, recorderOptions);
                recordedChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        recordedChunks.push(event.data);
                        console.log('Chunk received:', event.data.size, 'bytes');
                    }
                };

                mediaRecorder.onstop = () => {
                    console.log('MediaRecorder stopped, chunks:', recordedChunks.length);
                    finishRecording();
                };

                mediaRecorder.onerror = (event) => {
                    console.error('MediaRecorder error:', event.error);
                    updateRecordStatus(`Error: ${event.error.message || 'Recording failed'}`, 'error');
                    cleanupRecording();
                };

                // Start recording
                mediaRecorder.start(100); // Collect data every 100ms
                isRecording = true;
                recordingStartTime = Date.now();

                // Update UI
                document.getElementById('startRecordBtn').classList.add('recording');
                document.getElementById('stopRecordBtn').disabled = false;
                lockControlsForRecording(true);

                // Start countdown
                let remaining = recordingDuration;
                updateRecordStatus(`Recording ${recordingWidth}x${recordingHeight}... ${remaining}s`, 'recording');

                countdownInterval = setInterval(() => {
                    remaining = Math.max(0, recordingDuration - Math.floor((Date.now() - recordingStartTime) / 1000));
                    updateRecordStatus(`Recording ${recordingWidth}x${recordingHeight}... ${remaining}s`, 'recording');
                }, 1000);

                // Auto-stop after duration
                recordingTimer = setTimeout(() => {
                    stopRecording();
                }, recordingDuration * 1000);

                console.log('Recording started successfully');

            } catch (error) {
                console.error('Failed to start recording:', error);
                updateRecordStatus(`Error: ${error.message || 'Failed to start'}`, 'error');
                cleanupRecording();
            }
        }

        function stopRecording() {
            if (!isRecording || !mediaRecorder) return;

            console.log('Stopping recording...');

            // Clear timers
            if (recordingTimer) {
                clearTimeout(recordingTimer);
                recordingTimer = null;
            }
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }

            // Stop the recorder (this triggers onstop)
            if (mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }

            updateRecordStatus('Processing...', 'idle');
        }

        function finishRecording() {
            try {
                if (recordedChunks.length === 0) {
                    throw new Error('No video data recorded');
                }

                // Create blob
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                console.log('Video blob created:', blob.size, 'bytes');

                // Generate filename with resolution and bitrate
                const timestamp = Date.now();
                const bitrateMbps = Math.round(recordBitrate / 1000000);
                const filename = `school-of-tomorrows-ai-vignette_${recordingWidth}x${recordingHeight}_${recordingFps}fps_${recordingDuration}s_${bitrateMbps}Mbps_${timestamp}.webm`;

                // Download
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                updateRecordStatus(`Saved: ${filename}`, 'success');
                console.log('Video saved:', filename);

                // Auto-hide success after 5 seconds
                setTimeout(() => {
                    if (!isRecording) {
                        updateRecordStatus('Ready to record', 'idle');
                    }
                }, 5000);

            } catch (error) {
                console.error('Failed to save recording:', error);
                updateRecordStatus(`Error: ${error.message || 'Failed to save'}`, 'error');
            }

            cleanupRecording();
        }

        function cleanupRecording() {
            isRecording = false;
            mediaRecorder = null;
            recordedChunks = [];
            recordingStartTime = null;

            if (recordingTimer) {
                clearTimeout(recordingTimer);
                recordingTimer = null;
            }
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }

            // Remove CSS size lock so canvas can resize naturally again
            canvasElement.style.width = '';
            canvasElement.style.height = '';
            console.log('[REC] Removed CSS size lock');

            // Restore original canvas size and pixel density if changed
            const needsRestore = (originalCanvasWidth !== width || originalCanvasHeight !== height) ||
                                 (originalPixelDensity !== pixelDensity());

            if (needsRestore && originalCanvasWidth > 0 && originalCanvasHeight > 0) {
                console.log(`Restoring canvas from ${width}x${height} to ${originalCanvasWidth}x${originalCanvasHeight}`);

                // Restore pixel density first
                pixelDensity(originalPixelDensity);

                // Restore canvas size
                resizeCanvas(originalCanvasWidth, originalCanvasHeight);
                // Cache is in sim-space, no rebuild needed for canvas resize
                // Just mark dirty in case format changed
                dirty = true;

                console.log(`Canvas restored to ${width}x${height}, pixelDensity: ${pixelDensity()}`);
            }

            // Reset stored values
            originalCanvasWidth = 0;
            originalCanvasHeight = 0;
            originalPixelDensity = 1;

            // Re-enable UI
            document.getElementById('startRecordBtn').disabled = false;
            document.getElementById('startRecordBtn').classList.remove('recording');
            document.getElementById('stopRecordBtn').disabled = true;
            lockControlsForRecording(false);
        }

        // ============================================
        // Input Handlers
        // ============================================
        function mousePressed() {
            // Prevent drawing while recording
            if (isRecording) return;

            if (mouseX >= 0 && mouseX <= width && mouseY >= 0 && mouseY <= height) {
                let nx = mouseX / width;
                let ny = mouseY / height;
                pointsNorm.push({ x: nx, y: ny });
                dirty = true;
                console.log('Point added (normalized):', nx.toFixed(3), ny.toFixed(3));
            }
        }

        function mouseDragged() {
            // Prevent drawing while recording
            if (isRecording) return;

            if (mouseX >= 0 && mouseX <= width && mouseY >= 0 && mouseY <= height) {
                let nx = mouseX / width;
                let ny = mouseY / height;

                if (pointsNorm.length > 0) {
                    let last = pointsNorm[pointsNorm.length - 1];
                    let lastPixel = createVector(last.x * width, last.y * height);
                    let currentPixel = createVector(mouseX, mouseY);
                    let dist = p5.Vector.sub(currentPixel, lastPixel).magSq();

                    if (dist > seg_limit_sq * 9) {
                        pointsNorm.push({ x: nx, y: ny });
                        dirty = true;
                    }
                } else {
                    pointsNorm.push({ x: nx, y: ny });
                    dirty = true;
                }
            }
        }

        function keyPressed() {
            // Prevent most shortcuts while recording (except stop)
            if (isRecording) {
                // Allow Escape to stop recording
                if (keyCode === ESCAPE) {
                    stopRecording();
                }
                return;
            }

            if (key === 'c' || key === 'C') {
                resetToDefault();
            } else if (key === 'r' || key === 'R') {
                clearAll();
            } else if (key === 's' || key === 'S') {
                exportSVG();
            } else if (key === '+' || key === '=') {
                animSpeed = min(animSpeed + 0.5, 10);
                if (animSpeed > 0) prevSpeed = animSpeed;
                updateSpeedSlider();
            } else if (key === '-' || key === '_') {
                if (animSpeed > 0) {
                    animSpeed = max(animSpeed - 0.5, 0.1);
                    prevSpeed = animSpeed;
                }
                updateSpeedSlider();
            } else if (key === '0') {
                if (animSpeed === 0) {
                    animSpeed = prevSpeed;
                } else {
                    prevSpeed = animSpeed;
                    animSpeed = 0;
                }
                updateSpeedSlider();
            }
        }

        function updateSpeedSlider() {
            document.getElementById('speedSlider').value = animSpeed;
            document.getElementById('speedValue').textContent = animSpeed.toFixed(1);
        }

        function initPoints() {
            pointsNorm = [];
            for (let p of first_points) {
                pointsNorm.push({ x: p.x, y: p.y });
            }
            dirty = true;
            console.log('Initialized with', pointsNorm.length, 'points');
        }

        // ============================================
        // Chaikin Algorithm
        // ============================================
        function cleanV(pts, eps = 1e-9) {
            for (let i = pts.length - 1; i > 0; i--) {
                let dx = Math.abs(pts[i].x - pts[i-1].x);
                let dy = Math.abs(pts[i].y - pts[i-1].y);
                if (dx < eps && dy < eps) {
                    pts.splice(i, 1);
                }
            }
        }

        function chaikinReduce(pts, limit_sq) {
            if (pts.length <= 1) return pts;

            let reduced = pts.slice();
            let np = pts.length;
            let nr = reduced.length;

            do {
                np = nr;
                reduced = chaikinCutArray(reduced, 0.3, limit_sq);
                nr = reduced.length;
            } while (nr > np);

            return reduced;
        }

        function chaikinCutArray(pts, ratio, limit_sq) {
            let n = [];
            if (pts.length === 0) return n;

            n.push(pts[0].copy());

            if (pts.length > 1) {
                for (let i = 1; i < pts.length; i++) {
                    let cuts = chaikinCutVectors(pts[i-1], pts[i], ratio, limit_sq);
                    for (let c of cuts) {
                        n.push(c);
                    }
                }
                n.push(pts[pts.length - 1].copy());
            }

            cleanV(n);
            return n;
        }

        function chaikinCutVectors(a, b, ratio, limit_sq) {
            let n = [];

            if (p5.Vector.sub(a, b).magSq() <= limit_sq) {
                n.push(a.copy());
                n.push(b.copy());
                return n;
            }

            if (ratio > 0.5) ratio = 1 - ratio;

            n.push(p5.Vector.lerp(a, b, ratio));
            n.push(p5.Vector.lerp(b, a, ratio));

            return n;
        }
